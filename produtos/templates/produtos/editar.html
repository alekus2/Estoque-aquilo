{% extends 'core/base.html' %}

{% block title %}Editar produto{% endblock %}

{% block content %}

    <h1>Editar {{ produto.nome }}</h1>

    <form method="POST">
        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">Salvar alterações</button>
    </form>

    <a href="{% url 'listar_produtos' %}">
        Voltar
    </a>

{% endblock %}
