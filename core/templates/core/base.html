{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Estoque-aquilo{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1>Estoque-aquilo</h1>

            <nav>
                <a href="{% url 'home' %}">Início</a>
                <a href="{% url 'sobre' %}">Sobre</a>
            </nav>
        </div>
    </header>

    <main class="container content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>Estoque-aquilo © 2026 - Sistema de gerenciamento de estoque.</p>
    </footer>

</body>
</html>
